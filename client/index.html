<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NORMALIZE — In Normalize We Trust</title>
<meta name="description" content="Normalize — bags, apparel, caps and accessories, cut for people who dress with intention rather than noise.">
<meta property="og:title" content="NORMALIZE — In Normalize We Trust">
<meta property="og:description" content="Bags, apparel, caps and accessories — quiet luxury, made deliberate.">
<meta property="og:type" content="website">
<!-- Favicon: the struck gold coin, trimmed of its transparent margin so it
     still reads at 16px in a tab strip. -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#f4ede0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Archivo is requested as its VARIABLE font, with the wdth axis. There is no
     Google Fonts family called "Archivo Expanded" — the expanded width is an axis,
     and asking for it by name returns 200 with the family silently dropped, which
     is why the wordmark used to render in Helvetica. font-stretch: 125% in the
     stylesheet is what actually selects Expanded. Archivo is OFL. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,400..800&family=Cormorant+Garamond:wght@300;400;500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Black from the very first paint, so the coin intro never opens on a flash of
   the cream page. The failsafe animation hides it after 8s even if no script
   ever runs; reduced-motion visitors and no-JS never see it at all. */
#boot-curtain{position:fixed;inset:0;z-index:9999;background:#000;animation:boot-out .01s 8s forwards}
@keyframes boot-out{to{visibility:hidden}}
@media (prefers-reduced-motion:reduce){#boot-curtain{display:none}}
</style>
<noscript><style>#boot-curtain{display:none}</style></noscript>
</head>
<body>
<div id="boot-curtain"></div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
